<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found</title>
<style>
/* Put your own picture next to this file as error.png (about 400x400, transparent background works best) */
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#222;font-family:"Source Sans Pro","Segoe UI",Arial,Helvetica,sans-serif}
.wrap{max-width:540px;margin:0 auto;padding:24px 16px 40px;text-align:center}

.pic{height:380px;display:flex;align-items:center;justify-content:center}
.pic img{max-width:100%;max-height:100%;width:auto;height:auto;display:block}

h1{margin:14px 0 22px;font-size:36px;line-height:1.1;font-weight:800;letter-spacing:-.5px;color:#222}
.l1{margin:0 0 14px;font-size:15px;font-weight:700}
.l2{margin:0 0 22px;font-size:12.5px;font-weight:400}
.l2 a{color:#0b5cd5;text-decoration:none}

hr{border:0;border-top:1px solid #c8c8c8;margin:0 0 22px}

.btns{display:flex;justify-content:center;gap:4px}
/* colors sampled from the reference photo: top ~ #195ee9, bottom ~ #1046b0, 1px black border, square corners, ~20px tall */
.btn{display:inline-block;background:#195ee9 linear-gradient(#2a6cee 0%,#195ee9 15%,#195ee9 48%,#1249b3 56%,#1046b0 100%);color:#fff;border:1px solid #000;border-radius:0;
  font:700 12px/18px "Source Sans Pro","Segoe UI",Arial,sans-serif;height:20px;padding:0 9px;text-decoration:none;cursor:pointer;white-space:nowrap;
  box-shadow:none;text-shadow:none}
.btn:hover{background:#2468f0 linear-gradient(#3a78f2 0%,#2468f0 15%,#2468f0 48%,#1a52bd 56%,#1650ba 100%)}
.btn:active{background:#1046b0 linear-gradient(#1046b0,#195ee9)}

@media(max-width:480px){
  .pic{height:300px}
  h1{font-size:30px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="pic"><img src="error.png" alt="" onerror="this.parentNode.style.display='none'"></div>

  <h1>Requested page not found</h1>
  <p class="l1">You may have clicked an expired link or mistyped the address.</p>
  <p class="l2" id="contact">If you continue to receive this page, please contact customer service at <a id="mail" href="#"></a>.</p>

  <hr>

  <div class="btns">
    <a class="btn" href="#" onclick="history.back();return false">Go to Previous Page</a>
    <a class="btn" href="/">Return Home</a>
  </div>
</div>

<script>
// put your own contact email here (leave empty to hide the line)
var CONTACT = "";
if (CONTACT) { var m = document.getElementById("mail"); m.textContent = CONTACT; m.href = "mailto:" + CONTACT; }
else { document.getElementById("contact").style.display = "none"; }
</script>
</body>
</html>
